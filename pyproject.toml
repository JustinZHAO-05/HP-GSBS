[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hpgsbs"
version = "0.2.0"
description = "Auditable high-performance greedy state boundary search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Yanzhe Zhao"}]
maintainers = [{name = "Yanzhe Zhao"}]
keywords = ["neuroscience", "EEG", "GSBS", "segmentation", "CUDA", "Triton"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.14", "numba>=0.59", "threadpoolctl>=3", "psutil>=5", "tqdm>=4", "statesegmentation==0.0.6"]

[project.optional-dependencies]
test = ["pytest>=8", "joblib>=1.3"]
gpu = ["torch>=2.5"]
triton = ["triton>=3.1; sys_platform == 'linux'"]

[project.urls]
Homepage = "https://github.com/JustinZHAO-05/HP-GSBS"
Repository = "https://github.com/JustinZHAO-05/HP-GSBS"
Issues = "https://github.com/JustinZHAO-05/HP-GSBS/issues"
Documentation = "https://github.com/JustinZHAO-05/HP-GSBS#readme"
Releases = "https://github.com/JustinZHAO-05/HP-GSBS/releases"
Citation = "https://github.com/JustinZHAO-05/HP-GSBS/blob/main/CITATION.cff"

[project.scripts]
hpgsbs = "hpgsbs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA", "slow: extended reference validation"]
